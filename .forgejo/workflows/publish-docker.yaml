name: Build&Push -> Docker
on:
  schedule:
    - cron: "@monthly"
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: nixos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_KEY }}

      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MC 1_20_4
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          #platforms:
          #  - linux/amd64
          #  - linux/arm64
          build-args: |
            MC_VERSION=1_20_4
          tags: docker.io/jimurrito/minceraft:1_20_4

      - name: Build and push MC 1_21_1
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          #platforms:
          #  - linux/amd64
          #  - linux/arm64
          build-args: |
            MC_VERSION=1_21_1
          tags: |
            docker.io/jimurrito/minceraft:1_21_1
            docker.io/jimurrito/minceraft:latest
